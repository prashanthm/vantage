[project]
name = "vantage-server"
version = "0.1.0"
description = "Vantage deterministic portfolio backend: REST for the SPA, MCP tools for Mira. Read-only broker access (ADR-010)."
requires-python = ">=3.12"
# Real market data is a first-class dependency: yfinance is the quote + bar +
# fundamentals source. (The former "dependency-free / stdlib-only" principle was
# dropped — the app serves real prices, not demo fixtures.)
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
# OpenTelemetry tracing (observability). FastAPI auto-instrumentation + OTLP
# export; a no-op unless OTEL_EXPORTER_OTLP_ENDPOINT is set and these are
# installed. Reads inbound traceparent so Vantage spans join the SPA's trace.
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]
# Telegram user-account listener (telegram_listener.py). Imported lazily.
telegram = [
    "telethon>=1.36",
]
# Robinhood read-only position sync (brokers/robinhood.py). Imported lazily.
robinhood = [
    "mcp>=1.9",
]
# Zerodha (Kite Connect) read-only position sync (brokers/zerodha.py). Lazy.
zerodha = [
    "kiteconnect>=5",
]

[project.scripts]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vantage_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
