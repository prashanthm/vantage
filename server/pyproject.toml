[project]
name = "vantage-server"
version = "0.1.0"
description = "Vantage deterministic portfolio backend: REST for the SPA, MCP tools for Mira. Read-only broker access (ADR-010)."
requires-python = ">=3.12"
# Real market data is a first-class dependency: yfinance is the quote + bar +
# fundamentals source. (The former "dependency-free / stdlib-only" principle was
# dropped — the app serves real prices, not demo fixtures.)
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
# Claude forecast analyst (claude_forecast.py) — the Mira replacement for the
# AI forecast. Imported lazily; also needs ANTHROPIC_API_KEY in the env.
claude = [
    "anthropic>=0.40",
]
# Robinhood read-only position sync (brokers/robinhood.py). Imported lazily.
robinhood = [
    "mcp>=1.9",
]
# Zerodha (Kite Connect) read-only position sync (brokers/zerodha.py). Lazy.
zerodha = [
    "kiteconnect>=5",
]

[project.scripts]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vantage_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
