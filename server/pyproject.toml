[project]
name = "vantage-server"
version = "0.1.0"
description = "Vantage deterministic portfolio backend: REST for the SPA, MCP tools for Mira. Read-only (ADR-010)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vantage_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
