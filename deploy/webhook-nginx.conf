# Public-facing allowlist proxy: ONLY /webhook/tradingview reaches the backend.
# Everything else on this server returns 404, so exposing this via Cloudflare
# Tunnel does NOT expose the rest of the Vantage API. The webhook route itself
# is still secret-gated in the application (bad/missing secret → 401).

server {
    listen 80;
    server_name _;

    # backend is reachable by its compose service name on the shared network
    resolver 127.0.0.11 valid=30s;   # docker's embedded DNS

    # the ONE allowed route — POST only
    location = /webhook/tradingview {
        limit_except POST { deny all; }
        set $backend "http://vantage-backend:8641";
        proxy_pass $backend/webhook/tradingview;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
        client_max_body_size 16k;    # alerts are tiny; cap abuse
    }

    # a trivial health check for the tunnel (no backend contact)
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # everything else is invisible
    location / {
        return 404;
    }
}
