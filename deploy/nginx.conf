# Static file server for the buildless Vantage SPA on :8642.
# The SPA is hash-routed and self-contained (index.html + app.js/app.css +
# ds/ + vendor/), so a plain static root is enough; the try_files fallback to
# index.html is harmless and future-proofs any path-based routing.
worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Ensure JS is served with the right type (some alpine images miss .mjs).
    types { application/javascript js mjs; }

    server {
        listen      8642;
        server_name _;
        root        /usr/share/nginx/html;
        index       index.html;

        # Long-cache immutable vendored assets; the app shell stays revalidated.
        location ~* \.(js|css|svg|woff2?)$ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=3600";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Lightweight liveness for `docker healthcheck` / stack status.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }
    }
}
