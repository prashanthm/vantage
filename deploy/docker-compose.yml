# Vantage + Mira containerized stack (PROD / portable path).
#
# Dev path stays `./stack` (venv runner) at the repo root — see deploy/README.md.
#
# Run from anywhere:  docker compose -f deploy/docker-compose.yml up --build
#
# Service graph:
#   vantage-backend (:8641)  owns vantage.db  (READ-WRITE volume) + refresh writes
#   vantage-mcp     (:8640)  reads the SAME db (READ-ONLY volume)
#   vantage-spa     (:8642)  static SPA shell (browser talks to host-published ports)
#   mira            (:8080)  → vantage-mcp:8640/mcp (tools) + host Ollama (LLM)
#
# The named volume `vantage-data` starts EMPTY. Seed it once before first `up`
# (see deploy/README.md "Seeding the database") or the backend serves an empty
# portfolio. VANTAGE_QUOTES defaults to `yfinance` (real delayed quotes); set to `fixture` for
# the live delayed feed. ROBINHOOD_TOKEN_DIR (host dir holding
# .robinhood_token.json) is REQUIRED only for POST /api/refresh and
# /api/ticket/execute; reads work without it.

# Fixed project name so the volume is always `vantage_vantage-data` regardless
# of the directory compose is invoked from (the seed helper relies on this).
name: vantage

services:
  vantage-backend:
    build:
      context: ../server
      dockerfile: Dockerfile
    image: vantage-backend:local
    ports:
      - "8641:8641"
    volumes:
      # Read-write: the backend owns the db (refresh writes, WAL).
      - vantage-data:/data
      # The DIRECTORY holding the Robinhood OAuth token (.robinhood_token.json),
      # mounted READ-WRITE from a host path the operator sets in .env (never
      # baked into the image). Vantage owns the grant now (inherited from the
      # retired sentinel): refresh ROTATES the refresh token, and the atomic
      # save (os.replace) needs a writable parent dir — a single-file :ro
      # mount can neither be replaced nor updated. Reads work without it;
      # POST /api/refresh and /api/ticket/execute need it.
      - "${ROBINHOOD_TOKEN_DIR:-/dev/null}:/run/secrets/robinhood"
      # Sentinel's computed SPX intel (GEX/zones/breadth/macro), mounted READ-ONLY
      # so the nightly spx_playbook job can fuse it. Points at a host Sentinel
      # checkout via .env; /dev/null default keeps the stack bootable without it
      # (the playbook then reports a thinner read).
      - "${SENTINEL_LOGS_DIR:-/dev/null}:/sentinel/logs:ro"
      - "${SENTINEL_DATA_DIR:-/dev/null}:/sentinel/data:ro"
      # The repo pine/ dir, read-write, so the nightly playbook job refreshes
      # the generated TradingView artifacts (spx_playbook.pine etc.) instead of
      # writing to an ephemeral container path.
      - ../pine:/app/pine
    environment:
      VANTAGE_DB: /data/vantage.db
      VANTAGE_PINE_DIR: /app/pine
      # The data dir IS the writable volume — so the yfinance quote cache
      # (quotes_cache_yf.json) persists there instead of a non-existent
      # /app/data-local, otherwise every request re-fetches Yahoo (~13s each).
      VANTAGE_DATA_DIR: /data
      VANTAGE_QUOTES: "${VANTAGE_QUOTES:-yfinance}"
      ROBINHOOD_TOKEN_FILE: /run/secrets/robinhood/.robinhood_token.json
      # Zerodha (Kite Connect). The app key/secret come from YOUR host env/.env
      # (never baked in); the daily token file is the read-only mount above.
      KITE_API_KEY: "${KITE_API_KEY:-}"
      KITE_API_SECRET: "${KITE_API_SECRET:-}"
      # The daily token lives in the WRITABLE data volume so the one-click
      # /api/kite/callback can save it (and it persists across restarts).
      KITE_TOKEN_FILE: /data/.kite_token.json
      # Where the spx_playbook job reads Sentinel's artifacts (the mount above).
      SENTINEL_LOGS_DIR: /sentinel/logs
      SENTINEL_DATA_DIR: /sentinel/data
    healthcheck:
      # Generous timeout: the first quote snapshot after a cold start fetches
      # ~40 tickers from Yahoo (~15s) before the cache is warm.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8641/api/health',timeout=25).status==200 else 1)"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  vantage-mcp:
    build:
      # Repo root context so both server/ and mcp/ are visible to the build.
      context: ..
      dockerfile: mcp/Dockerfile
    image: vantage-mcp:local
    ports:
      - "8640:8640"
    healthcheck:
      # A bare GET to /mcp answers 406 (streamable-HTTP handshake required) —
      # any HTTP response proves the server is up.
      test: ["CMD", "python", "-c", "import urllib.request,urllib.error,sys\ntry:\n    urllib.request.urlopen('http://127.0.0.1:8640/mcp', timeout=5); sys.exit(0)\nexcept urllib.error.HTTPError:\n    sys.exit(0)\nexcept Exception:\n    sys.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    # Run as the backend's uid so it can OPEN the shared vantage.db. SQLite in
    # WAL mode (db.py forces PRAGMA journal_mode=WAL on connect) needs WRITE
    # access to the db file to attach/create the -wal/-shm sidecars — a truly
    # read-only OS mount fails with "unable to open database file". So the mount
    # is read-write at the OS level; the READ-ONLY guarantee is enforced in code
    # (ADR-010): the MCP tool surface only ever calls Store.load_* and never any
    # write method. See deploy/README.md "Why the MCP mount is read-write".
    user: "10001:10001"
    volumes:
      # SAME db as the backend. RW at the OS layer (WAL needs it); read-only by
      # doctrine (ADR-010) — the MCP surface never mutates.
      - vantage-data:/data
    environment:
      VANTAGE_DB: /data/vantage.db
      VANTAGE_DATA_DIR: /data
      VANTAGE_QUOTES: "${VANTAGE_QUOTES:-yfinance}"
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8640"
      MCP_PATH: /mcp
    depends_on:
      # The db must exist (backend created/seeded it) before MCP reads it.
      vantage-backend:
        condition: service_started
    restart: unless-stopped

  vantage-spa:
    build:
      # Repo root context so index.html/app.js/app.css/ds/vendor are visible.
      context: ..
      dockerfile: Dockerfile.spa
    image: vantage-spa:local
    ports:
      - "8642:8642"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8642/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  mira:
    build:
      # Sibling checkout (vantage/ and mira/ side by side) — portable, unlike
      # a home-absolute path.
      context: ../../mira
      dockerfile: Dockerfile
    image: mira:local
    ports:
      - "8080:8080"
    environment:
      # Deployment profile: `local` (in-memory providers, no cloud SDK) is the
      # right shape for this self-hosted Docker stack. WITHOUT it, build_app gets
      # no profile and the /turn path degrades — the supervisor emits an empty
      # synthesis and the reasoning loop never runs, so chat returns nothing.
      DEPLOYMENT_PROFILE: "${DEPLOYMENT_PROFILE:-local}"
      PLATFORM: "${PLATFORM:-local}"
      # Vantage MCP over the compose network (container DNS name), NOT localhost.
      MCP_BASE_URL: "${MCP_BASE_URL:-http://vantage-mcp:8640/mcp}"
      # Host Ollama (OpenAI-compatible). Override in .env for a different LLM.
      LLM_BASE_URL: "${LLM_BASE_URL:-http://host.docker.internal:11434/v1}"
      # Must be a tag Ollama actually has (`ollama list`) — a bare "qwen2.5"
      # with no tag 404s and the advisor returns empty. Override in .env.
      LLM_MODEL: "${LLM_MODEL:-qwen2.5:7b}"
      LLM_API_KEY: "${LLM_API_KEY:-ollama}"
      # Model-tier routing (ADR-052). MODEL_ROUTES maps capability tiers to
      # concrete models against LLM_BASE_URL: /analyze synthesis asks for the
      # `deep` tier (strong model, grounded multi-domain prose), the playbook
      # narrator and facets ride `light`. Unset = no router, everything on
      # LLM_MODEL. ENABLE_TIER_ESCALATION adds the one-retry quality escalator.
      MODEL_ROUTES: "${MODEL_ROUTES:-}"
      ENABLE_TIER_ESCALATION: "${ENABLE_TIER_ESCALATION:-}"
    extra_hosts:
      # Linux needs this mapping for host.docker.internal (no-op on Docker Desktop).
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=10).status==200 else 1)"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 20s
    depends_on:
      vantage-mcp:
        condition: service_healthy
    restart: unless-stopped

volumes:
  vantage-data:
    # Named volume the backend owns and the MCP mounts read-only.
